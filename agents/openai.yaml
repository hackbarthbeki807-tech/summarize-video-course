interface:
  display_name: "视频课程总结与交付 v2.8"
  short_description: "本地课程笔记生成、案例结构化与七项资料交付"
  default_prompt: "使用 $summarize-video-course 处理这批本地课程：先读取项目规则、状态和逐字稿，按框架方法型、课堂推导型、清单工具型或混合型选择笔记结构，不套统一模板；总览和逻辑稿开头必须写 3–8 条完整的‘本课学会什么’，本课解决的问题、核心结论、实际操作顺序、适合谁看必须成句成义；每个知识点只表达一个主题，按真实内容生成卡片，不设固定数量上限，并区分老师原话、模型整理、意译和重点核对；案例必须按‘背景—问题与分析—动作/改造方式—结果—可复用启发’展开，背景必须交代主体/产品、原来的做法或现状和触发问题；当材料有项目目标、执行动作、数据、关键转折、失败或限制时，扩展为‘项目背景—目标与初始问题—执行动作—数据结果—关键转折点与调整—失败/限制—可复用经验’，不编造缺失数据；区分真实案例、行业案例、课堂示例、正反例和假设案例，保留来源与数据可信度；金句必须是带时间戳的完整原话或明确标注的原话候选，模型摘要不能冒充金句；先扫描举例提示及上下文，案例同时进入逻辑稿和案例页，不能漏写成‘本课未发现’；图片不可读只写‘课件图示未提取’，关键图示缺失时停止正式发布；模型失败或结构不完整时停止该课，不发布摘录占位版；每课必须交付完整七项资料，验收消息同一条中给本批真实可读的 01-逻辑稿.md 和其余六项直接入口，不能用 .cmd、文件夹或批次报告代替；长任务先进入目标模式并持续监控，完成后主动通知，未经人工验收不开始下一批；已有课时升级先写入 work/note-upgrade-staging-*，验证后再发布并保留备份。"
