interface:
  display_name: "视频课程总结与交付 v3.24"
  short_description: "本地整理课程、课件、关键画面并以可回滚收尾交付"
  default_prompt: "使用 $summarize-video-course 按 v3.22 规则在本地整理课程及课件：每门新课程先完成只读来源扫描、去重与课时筛选预判、分项工作量预估并让用户看到，再开始转写；先建立并自动对账全部来源清单、进入目标模式；先区分规范主来源、重复格式、非知识内容和待确认项；筛选非知识课；只审查强知识提示的视频画面；使用动态分块和局部恢复生成完整七项资料；课件唯一映射时必须融合，页眉页脚/广告/致谢/纯提问页不得污染阅读层，图表保留必要原图加结构化解读；批次和课程只维护一个稳定可读的实时进度入口，区分当前课时阶段、批次百分比与发布状态；交付用户前执行 AI 质量委员会，并在课程收尾前回溯所有历史正式包和小样转正式包，强制修复知识点覆盖、复用公式/表达、完整案例、画面结构化摘要与原图可打开性，保留前后门禁证据；新增反复漏项回归：关键画面必须完成 OCR 辅助文本、原图可打开检查、视觉语义总结和时间戳，复用表达先写 A+B+C/步骤/分支，案例必须具备背景、问题分析、动作、结果、限制与启发，明确 ASR 错词只修阅读层且不改逐字稿，发布前精确核对来源、课时集合和课时资料路径，失败状态必须同步进度入口；用户说继续时读取真实断点并避免重复确认或重复进程；自动续接和心跳无新里程碑时只做内部检查并静默结束，不生成用户可见消息；使用 notification-state.json 按事件键去重，仅在启动、课时完成、发布/验收、异常/恢复、批次完成或需要决定时通知；正式批次只追加不覆盖；用户最终验收后仅用交易式 course_closeout 收尾，实际重开课程首页、手册、资料索引与逻辑稿；只有结构、来源、画面、课件融合、自动验证和人工验收六层全部通过，才宣布课程完成。"
