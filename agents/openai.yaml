interface:
  display_name: "视频课程总结与交付 V3.29.0"
  short_description: "本地整理课程、课件、关键画面并以可回滚收尾交付"
  default_prompt: "使用 $summarize-video-course 按 V3.29.0 本地处理课程：先估工作量、核来源；写稿前扫描公式、完整原例和课件知识。外部工具只提供V2完整机械证据，不写摘要或案例，Codex回源定稿、逐页视觉与每课独立查漏。递归冻结全部引用资产，机械通过不等于内容正确；三个收据绑定进度集合、单一链接，交付/异常/需决定才通知。用户验收后用交易式收尾并实际重开入口，条件接受不冒充回源核实，缺实测Token和可比基线不宣称省额度。"
